
name: Test Trading Bot

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test
        run: python bot.py

